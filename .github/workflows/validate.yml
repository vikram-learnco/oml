name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: oml validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/oml/pyproject.toml
      - name: Install tooling
        run: pip install -e tools/oml
      - name: Run tests
        run: python -m unittest discover -s tools/tests
      - name: Validate records
        id: validate
        run: |
          set -o pipefail
          oml validate records/ --strict 2> errors.txt | tee summary.txt
      - name: Summary
        if: always()
        run: |
          echo "### oml validate" >> "$GITHUB_STEP_SUMMARY"
          if [ -f summary.txt ]; then cat summary.txt >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -s errors.txt ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat errors.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check INDEX.md is current
        run: |
          oml index
          git diff --exit-code -- records/INDEX.md || { echo "::error::records/INDEX.md is stale; run 'oml index' and commit"; exit 1; }
      - name: Exports build
        run: oml export all --version ci
