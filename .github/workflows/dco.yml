name: dco

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dco:
    name: sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit carries a Signed-off-by line
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          # Merge commits carry the sign-offs of the commits they merge.
          for sha in $(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}"); do
            if git show -s --format='%B' "$sha" | grep -qiE '^Signed-off-by: .+ <[^>]+>[[:space:]]*$'; then
              continue
            fi
            author="$(git show -s --format='%an <%ae>' "$sha")"
            echo "::error::$(git show -s --format='%h %s' "$sha") has no Signed-off-by line (author: ${author})"
            missing=$((missing + 1))
          done
          if [ "$missing" -eq 0 ]; then
            echo "All commits signed off." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### DCO check failed"
            echo
            echo "${missing} commit(s) are missing a \`Signed-off-by\` line. Sign-off is your"
            echo "assertion under the [Developer Certificate of Origin](https://developercertificate.org/)"
            echo "that you have the right to contribute the text."
            echo
            echo "Fix the most recent commit:"
            echo
            echo '```sh'
            echo "git commit --amend -s --no-edit && git push --force-with-lease"
            echo '```'
            echo
            echo "Fix a whole branch:"
            echo
            echo '```sh'
            echo "git rebase --signoff origin/main && git push --force-with-lease"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
